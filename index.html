<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>用語集｜総合確認テストアプリ</title>

<style>
body{
  font-family:system-ui,"Yu Gothic",sans-serif;
  margin:0;background:#f4f6f9;color:#222;
}
header{
  background:linear-gradient(135deg,#13315c,#0f7b8a);
  color:#fff;padding:18px;font-size:1.2rem;
  box-shadow:0 2px 6px rgba(0,0,0,.25);
}
main{padding:20px}
.card{
  background:#fff;padding:20px;border-radius:12px;
  box-shadow:0 2px 6px rgba(0,0,0,.1);
  margin-bottom:20px;border-left:6px solid #0f7b8a;
}
button{
  width:100%;padding:14px;border:none;border-radius:8px;
  background:#0f7b8a;color:#fff;font-size:1rem;
  margin-top:10px;
}
.modeBtn{
  background:#145c3a;margin-bottom:15px;
}
#answerBox{
  margin-top:15px;padding:15px;border-radius:10px;
  background:#eef7ff;border-left:5px solid #0f7b8a;
}
input{
  width:100%;padding:10px;margin-top:10px;
  border-radius:8px;border:1px solid #ccc;
}
#rankingBox{
  background:#fff;padding:15px;margin-top:20px;
  border-radius:10px;display:none;
}
</style>
</head>

<body>
<header>用語集｜総合確認テストアプリ</header>
<main>

<!-- 正答率表示 -->
<div style="padding:10px; background:#fff; margin:10px; border-radius:8px;">
  <strong>正答率：</strong>
  <span id="rate">計算中…</span>
</div>

<!-- モード切替 -->
<button class="modeBtn" onclick="toggleMode()">現在：
  <span id="modeLabel">通常問題</span>（クリックで切替）
</button>

<!-- ランキング表示 -->
<div id="rankingBox"></div>

<!-- 問題カード -->
<div class="card">
  <h2 id="term">読み込み中…</h2>
  <p id="questionText" style="color:#555">説明を答えてください。</p>

  <div id="answerBox" style="display:none"></div>

  <input id="reverseInput" style="display:none" placeholder="用語を入力">
  <button onclick="checkReverse()" id="reverseBtn" style="display:none">回答する</button>

  <button onclick="showAnswer()" id="showBtn">答えを見る</button>
  <button style="background:#145c3a" onclick="next()">次の問題へ</button>
</div>

</main>

<script>
// ===============================
// 正答率記録（全体）
// ===============================
let correctCount = 0;
let wrongCount = 0;

if(localStorage.getItem("correctCount")){
  correctCount = parseInt(localStorage.getItem("correctCount"));
  wrongCount = parseInt(localStorage.getItem("wrongCount"));
}

function updateRate(){
  const total = correctCount + wrongCount;
  const rate = total === 0 ? 0 : Math.round((correctCount / total) * 100);
  document.getElementById("rate").textContent =
    `${correctCount} 正解 / ${wrongCount} 不正解（正答率 ${rate}%）`;

  localStorage.setItem("correctCount", correctCount);
  localStorage.setItem("wrongCount", wrongCount);
}
updateRate();

// ===============================
// 用語データ（用語別スコア付き）
// ===============================
const DATA = [

  {t:"インドカレー", a:"スパイスを炒めて香りを立て、トマトやヨーグルトで作るサラッとしたカレー。", correct:0, wrong:0},

  {t:"北インドカレー", a:"濃厚でクリーミー。ナンやチャパティと食べる。乳製品を多用。", correct:0, wrong:0},
  {t:"南インドカレー", a:"サラッとして甘酸っぱく、米と食べるスタイルが中心。", correct:0, wrong:0},
  {t:"カレーの夏バテ予防効果", a:"スパイスの薬膳効果、発汗作用、栄養バランスの高さが理由。", correct:0, wrong:0},
  {t:"インドのベジタリアン", a:"人口の30〜40%。宗教的理由で肉・魚・卵を避け、乳製品は摂取。", correct:0, wrong:0},
  {t:"伊勢崎市の外国人住民", a:"人口の約8.2〜8.3%。製造業の雇用を支え、多文化が定着。", correct:0, wrong:0},
  {t:"多文化共生のメリット", a:"労働力確保、人口減少の緩和、文化の多様化、行政ノウハウ蓄積。", correct:0, wrong:0},
  {t:"多文化共生のデメリット", a:"生活習慣の違い、言語の壁、コミュニティ分断、治安への不安感。", correct:0, wrong:0},
  {t:"レトロモダン", a:"懐かしさと現代的デザインを融合したスタイル。", correct:0, wrong:0},
  {t:"グローカル", a:"Think globally, act locally。世界視野と地域性の融合。", correct:0, wrong:0},
  {t:"ブランディング", a:"顧客の頭の中に独自イメージを築く活動。", correct:0, wrong:0},
  {t:"マーケティング", a:"商品が自然に売れる仕組みを作る活動（調査→設計→販売→改善）。", correct:0, wrong:0},
  {t:"経営学", a:"組織が資源を活かして目標を達成する仕組みを研究する学問。", correct:0, wrong:0},

  {t:"リノベーション", a:"既存建物を新築以上の価値に高める改修。", correct:0, wrong:0},
  {t:"秩父のまちおこし", a:"アニメ、ウイスキー、鉄道、温泉、官民協働が成功要因。", correct:0, wrong:0},
  {t:"アルベルゴ・ディフーゾ", a:"街全体をホテルのように運営する分散型観光モデル。", correct:0, wrong:0},

  {t:"チャレンジショップ", a:"低リスクで期間限定出店できる仕組み。", correct:0, wrong:0},
  {t:"年貸し販売棚", a:"棚の一区画を年間契約でレンタルし委託販売できる仕組み。", correct:0, wrong:0},
  {t:"Haji-Maru", a:"築100年の空き家を改修した複合施設。飲食・本棚・イベント。", correct:0, wrong:0},
  {t:"居抜き物件", a:"前テナントの内装・設備をそのまま使える物件。初期費用を削減。", correct:0, wrong:0},
  {t:"什器", a:"店舗で使う家具・器具の総称。", correct:0, wrong:0},
  {t:"日本政策金融公庫", a:"国が出資する金融機関。創業融資を行う。", correct:0, wrong:0},
  {t:"収支目標", a:"売上・経費・利益の具体的な数値目標。", correct:0, wrong:0},
  {t:"DIY", a:"専門業者に頼らず自分で内装や家具を作ること。", correct:0, wrong:0},
  {t:"価値創発", a:"異なる人や技術が混ざり新しい価値が突発的に生まれる現象。", correct:0, wrong:0},
  {t:"ソーシャルイノベーション", a:"社会課題を革新的な仕組みで解決する変革。", correct:0, wrong:0},
  {t:"実践知", a:"状況に応じて望ましい行動を判断し実践する力。", correct:0, wrong:0},
  {t:"サイバー空間", a:"インターネット上の仮想情報空間。リアルとの融合が重要。", correct:0, wrong:0},
  {t:"財政学", a:"政府の財政活動が社会に与える影響を研究する学問。", correct:0, wrong:0},
  {t:"グローバル社会", a:"国境を越えて人・モノ・情報が移動し相互に影響し合う社会。", correct:0, wrong:0},
  {t:"国際観光論", a:"国際観光を経済・文化・政策など多角的に研究する学問。", correct:0, wrong:0},
  {t:"経営心理学", a:"組織の心理・行動を解明し経営に活かす学問。", correct:0, wrong:0},
  {t:"政策提言", a:"社会課題解決のため行政へ具体的政策を提案すること。", correct:0, wrong:0},
  {t:"多文化共生", a:"異なる文化の人々が対等に共に生きること。", correct:0, wrong:0},
  {t:"地方創生", a:"人口減少と一極集中を是正し地域の強みで持続可能社会を作る政策。", correct:0, wrong:0}
];

// 用語別スコア読み込み
const saved = localStorage.getItem("DATA_SCORE");
if(saved){
  const arr = JSON.parse(saved);
  for(let i=0; i<DATA.length; i++){
    DATA[i].correct = arr[i].correct;
    DATA[i].wrong = arr[i].wrong;
  }
}

function saveScore(){
  localStorage.setItem("DATA_SCORE", JSON.stringify(DATA));
}

// ===============================
// 学習ログ
// ===============================
function logStudy(){
  const today = new Date().toISOString().slice(0,10);
  let log = JSON.parse(localStorage.getItem("STUDY_LOG") || "{}");

  if(!log[today]) log[today] = 0;
  log[today]++;

  localStorage.setItem("STUDY_LOG", JSON.stringify(log));
}

function showLog(){
  const log = JSON.parse(localStorage.getItem("STUDY_LOG") || "{}");
  let html = "<h3>学習ログ</h3>";

  for(const day in log){
    html += `<p>${day}：${log[day]}問</p>`;
  }

  document.getElementById("rankingBox").innerHTML = html;
  document.getElementById("rankingBox").style.display = "block";
}

// ===============================
// モード切替
// ===============================
let mode = "normal"; // normal / blank / choice / reverse / weak / ranking / log

function toggleMode(){
  if(mode === "normal") mode = "blank";
  else if(mode === "blank") mode = "choice";
  else if(mode === "choice") mode = "reverse";
  else if(mode === "reverse") mode = "weak";
  else if(mode === "weak") mode = "ranking";
  else if(mode === "ranking") mode = "log";
  else mode = "normal";

  const label = {
    normal: "通常問題",
    blank: "穴埋め問題",
    choice: "四択問題",
    reverse: "逆引き問題",
    weak: "弱点出題",
    ranking: "正答率ランキング",
    log: "学習ログ"
  };

  document.getElementById("modeLabel").textContent = label[mode];
  render();
}
// ===============================
// 出題ロジック
// ===============================
let idx = 0;

function shuffle(){
  for(let i = DATA.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [DATA[i], DATA[j]] = [DATA[j], DATA[i]];
  }
}
shuffle();

// 通常問題
function renderNormal(){
  const term = DATA[idx].t;
  const ans = DATA[idx].a;

  document.getElementById("rankingBox").style.display = "none";

  document.getElementById("term").textContent = term;
  document.getElementById("questionText").textContent = "説明を答えてください。";

  document.getElementById("answerBox").style.display = "none";
  document.getElementById("reverseInput").style.display = "none";
  document.getElementById("reverseBtn").style.display = "none";
  document.getElementById("showBtn").style.display = "block";

  document.getElementById("answerBox").textContent = ans;
}

// 穴埋め問題
function makeBlank(text){
  const words = text.split(/、|。| /);
  const target = words[Math.floor(Math.random()*words.length)];
  return text.replace(target, "＿＿＿＿");
}

function renderBlank(){
  const term = DATA[idx].t;
  const ans = DATA[idx].a;

  document.getElementById("rankingBox").style.display = "none";

  document.getElementById("term").textContent = term;
  document.getElementById("questionText").textContent = "穴埋め部分を答えてください：";

  document.getElementById("answerBox").style.display = "none";
  document.getElementById("reverseInput").style.display = "none";
  document.getElementById("reverseBtn").style.display = "none";
  document.getElementById("showBtn").style.display = "block";

  document.getElementById("answerBox").textContent = makeBlank(ans);
}

// 四択問題
function makeChoices(correct){
  let others = DATA.filter(item => item.t !== correct).map(item => item.t);
  others = others.sort(() => Math.random() - 0.5).slice(0,3);
  return [...others, correct].sort(() => Math.random() - 0.5);
}

function renderMultipleChoice(){
  const term = DATA[idx].t;
  const ans = DATA[idx].a;

  document.getElementById("rankingBox").style.display = "none";

  document.getElementById("term").textContent = "この説明の用語は？";
  document.getElementById("questionText").textContent = ans;

  document.getElementById("answerBox").style.display = "block";
  document.getElementById("reverseInput").style.display = "none";
  document.getElementById("reverseBtn").style.display = "none";
  document.getElementById("showBtn").style.display = "none";

  const choices = makeChoices(term);
  let html = "";
  choices.forEach(choice => {
    html += `<button onclick="checkChoice('${choice}')">${choice}</button>`;
  });

  document.getElementById("answerBox").innerHTML = html;
}

function checkChoice(selected){
  const correctTerm = DATA[idx].t;

  if(selected === correctTerm){
    DATA[idx].correct++;
    correctCount++;
    alert("正解！");
  }else{
    DATA[idx].wrong++;
    wrongCount++;
    alert("不正解… 正解は「" + correctTerm + "」");
  }

  saveScore();
  updateRate();
  logStudy();
}

// 逆引き問題
function renderReverse(){
  const term = DATA[idx].t;
  const ans = DATA[idx].a;

  document.getElementById("rankingBox").style.display = "none";

  document.getElementById("term").textContent = "この説明の用語は？";
  document.getElementById("questionText").textContent = ans;

  document.getElementById("answerBox").style.display = "none";
  document.getElementById("reverseInput").style.display = "block";
  document.getElementById("reverseBtn").style.display = "block";
  document.getElementById("showBtn").style.display = "none";
}

function checkReverse(){
  const userAnswer = document.getElementById("reverseInput").value.trim();
  const correctTerm = DATA[idx].t;

  if(userAnswer === correctTerm){
    DATA[idx].correct++;
    correctCount++;
    alert("正解！");
  }else{
    DATA[idx].wrong++;
    wrongCount++;
    alert(`不正解… 正解は「${correctTerm}」`);
  }

  saveScore();
  updateRate();
  logStudy();
}

// 弱点出題
function pickWeak(){
  document.getElementById("rankingBox").style.display = "none";

  const sorted = DATA
    .map((item, i) => ({...item, index:i}))
    .sort((a,b)=>{
      const ar = a.correct + a.wrong === 0 ? 0 : a.correct/(a.correct+a.wrong);
      const br = b.correct + b.wrong === 0 ? 0 : b.correct/(b.correct+b.wrong);
      return ar - br; // 正答率が低い順
    });

  idx = sorted[0].index;
  renderNormal();
}

// 正答率ランキング
function showRanking(){
  let list = DATA.map(item=>{
    const total = item.correct + item.wrong;
    const rate = total === 0 ? 0 : Math.round(item.correct/total*100);
    return {term:item.t, rate};
  }).sort((a,b)=>a.rate - b.rate);

  let html = "<h3>正答率ランキング（苦手→得意）</h3>";
  list.forEach(item=>{
    html += `<p>${item.term}：${item.rate}%</p>`;
  });

  document.getElementById("rankingBox").innerHTML = html;
  document.getElementById("rankingBox").style.display = "block";
}
// ===============================
// モード統合（render）
// ===============================
function render(){
  if(mode === "normal") renderNormal();
  else if(mode === "blank") renderBlank();
  else if(mode === "choice") renderMultipleChoice();
  else if(mode === "reverse") renderReverse();
  else if(mode === "weak") pickWeak();
  else if(mode === "ranking") showRanking();
  else if(mode === "log") showLog();
}

// ===============================
// 次の問題へ
// ===============================
function next(){
  idx = (idx + 1) % DATA.length;
  render();
}

// ===============================
// 初期表示
// ===============================
render();

</script>

</body>
</html>
